
spring.application.name=backend

spring.datasource.url=${CINELODE_DATABASE_URL:jdbc:sqlite:data/cinelode.db}
server.address=${CINELODE_SERVER_ADDRESS:127.0.0.1}
server.ssl.enabled=${CINELODE_TLS_ENABLED:true}
server.ssl.key-store=${CINELODE_TLS_KEYSTORE:}
server.ssl.key-store-password=${CINELODE_TLS_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.forward-headers-strategy=none
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${CINELODE_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

cinelode.security.username=${CINELODE_USERNAME:cinelode}
cinelode.security.password-hash=${CINELODE_PASSWORD_HASH:}
cinelode.security.dev-login-enabled=${CINELODE_DEV_LOGIN:false}
cinelode.security.remember-me-enabled=${CINELODE_REMEMBER_ME:false}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

cinelode.media.root=${CINELODE_MEDIA_ROOT}
cinelode.series.root=${CINELODE_SERIES_ROOT}

spring.config.import=optional:file:.env.local[.properties],optional:file:backend/.env.local[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties]
cinelode.database.backup-directory=${CINELODE_DB_BACKUP_DIRECTORY:}

omdb.api.key=${OMDB_API_KEY:}

# FFmpeg toolchain
cinelode.ffprobe.path=${CINELODE_FFPROBE_PATH:ffprobe}
cinelode.ffmpeg.path=${CINELODE_FFMPEG_PATH:ffmpeg}

# Long-running media streams must not be terminated after 30 seconds.
spring.mvc.async.request-timeout=0
